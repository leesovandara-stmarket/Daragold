<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>តម្លៃហាងឆេងមាសអន្តរជាតិ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&family=Archivo:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#11151c;color:#e8eaf0;
 font-family:'Kantumruy Pro',system-ui,sans-serif;padding:8px 8px 26px}
#boot{display:none;background:#8d1b1b;color:#fff;padding:9px;border-radius:8px;
 font-size:12px;margin-bottom:8px;white-space:pre-wrap}
#cv{width:100%;max-width:520px;display:block;margin:0 auto;border-radius:12px;
 box-shadow:0 6px 24px rgba(0,0,0,.55);touch-action:none}
.wrap{max-width:520px;margin:0 auto}
.hint{text-align:center;font-size:12.5px;color:#8f97a8;margin:9px 0 11px}
#ctrl{display:none;gap:5px;align-items:center;margin:0 0 11px;flex-wrap:wrap}
#ctrl b{font-size:12.5px;color:#4FC3F7;margin-right:4px;min-width:64px}
#ctrl button{flex:1;min-width:38px;padding:11px 3px;background:#1b212c;
 border:1px solid #2c3444;color:#dfe5ee;font-size:16px}
.row{display:flex;gap:8px;margin-bottom:8px}
.fld{flex:1;background:#1b212c;border:1px solid #2c3444;border-radius:11px;padding:8px 11px}
.fld label{display:block;font-size:11px;color:#8f97a8;margin-bottom:3px}
.fld input{width:100%;background:none;border:0;color:#fff;font-size:17px;
 font-weight:700;outline:none;font-family:inherit}
button{font-family:inherit;border:0;border-radius:11px;font-weight:700;cursor:pointer}
#go{width:100%;padding:16px;background:linear-gradient(180deg,#F8E0A0,#C9962F);
 color:#3a1008;font-size:18px;margin-bottom:9px}
.sec{font-size:11px;color:#8f97a8;margin:13px 0 6px;letter-spacing:.4px}
.tbtns{display:flex;gap:7px}
.tb{flex:1;padding:11px 4px;background:#1b212c;border:2px solid #2c3444;
 color:#c3cad8;font-size:13px}
.tb.on{border-color:#F8E0A0;color:#F8E0A0;background:#241f12}
.mini{display:flex;gap:7px;flex-wrap:wrap}
.mini button{flex:1;min-width:100px;padding:11px 6px;background:#1b212c;
 border:1px solid #2c3444;color:#c3cad8;font-size:13px}
.cols{display:flex;gap:7px}
.cw{flex:1;background:#1b212c;border:1px solid #2c3444;border-radius:11px;
 padding:7px 9px;display:flex;align-items:center;gap:7px}
.cw span{font-size:11.5px;color:#8f97a8}
.cw input[type=color]{width:32px;height:29px;border:0;background:none;padding:0}
#b_tg{width:100%;padding:14px;background:#229ED9;color:#fff;font-size:16px;margin-bottom:8px}
.tgst{font-size:13px;color:#8f97a8;margin-bottom:8px;min-height:18px}
.tgnote{font-size:11px;color:#6f7787;margin-top:6px;line-height:1.5}
#pop,#save{position:fixed;inset:0;background:rgba(6,9,14,.93);display:none;
 z-index:60;padding:16px;overflow:auto}
#pop .box{max-width:430px;margin:70px auto;background:#1b212c;border-radius:15px;padding:17px}
#pop h4{margin:0 0 11px;font-size:15px;color:#F8E0A0;font-weight:700}
#pop input{width:100%;padding:13px;font-size:18px;border-radius:10px;
 border:1px solid #39424f;background:#11151c;color:#fff;font-family:inherit;font-weight:700}
#pop .bb{display:flex;gap:8px;margin-top:12px}
#pop .bb button{flex:1;padding:13px;background:#2c3444;color:#fff;font-size:15px}
#pop .bb .ok{background:linear-gradient(180deg,#F8E0A0,#C9962F);color:#3a1008}
#pop .auto{width:100%;margin-top:9px;padding:12px;background:#243040;color:#9fd2ff;font-size:14px;border-radius:10px;font-weight:700}
#save .box{max-width:430px;margin:0 auto;text-align:center}
#save img{width:100%;border-radius:11px;margin-bottom:12px}
#save .tip{font-size:13.5px;color:#F8E0A0;margin-bottom:11px;line-height:1.55}
#save button{width:100%;padding:14px;margin-bottom:8px;background:#2c3444;color:#fff;font-size:15px}
#save .dl{background:linear-gradient(180deg,#F8E0A0,#C9962F);color:#3a1008}
</style>
</head>
<body>
<div id="boot"></div>
<div class="wrap">
<canvas id="cv" width="1080" height="1080"></canvas>
<div class="hint" style="color:#4FC3F7">v11 · ចុចលើតម្លៃ ឬកាលបរិច្ឆេទ ដើម្បីកែ · អូសដើម្បីផ្លាស់ទី</div>
<div id="ctrl">
 <b id="ctrl_n">—</b>
 <button id="c_lf">←</button><button id="c_rt">→</button>
 <button id="c_up">↑</button><button id="c_dn">↓</button>
 <button id="c_sm">−</button><button id="c_bg">+</button>
 <button id="c_rs">↺</button>
</div>

<button id="go">រក្សាទុករូបភាព</button>

<input id="i_oz" value="4600" style="display:none">

<div class="row">
 <div class="fld"><label>កាលបរិច្ឆេទ</label><input id="i_date" type="text" value=""></div>
</div>
<div class="row">
 <div class="fld"><label>ម៉ោង</label><input id="i_time" type="text" value=""></div>
</div>
<input id="i_line" value="" style="display:none">


<div class="sec">ជ្រើសរើសទម្រង់</div>
<div class="tbtns">
 <button class="tb on" data-t="1">មាស</button>
 <button class="tb" data-t="2">ស</button>
 <button class="tb" data-t="3">លឿង</button>
</div>

<div class="sec">ពណ៌អក្សរ</div>
<div class="cols">
 <div class="cw"><input type="color" id="c_price" value="#F8E0A0"><span>តម្លៃ</span></div>
 <div class="cw"><input type="color" id="c_date" value="#FFFFFF"><span>កាលបរិច្ឆេទ</span></div>
</div>

<div class="sec">ផ្ញើទៅ Telegram</div>
<button id="b_tg">ផ្ញើរូបទៅ Channel</button>
<div id="tg_st" class="tgst"></div>
<div id="tg_cfg">
 <div class="row"><div class="fld"><label>Bot token (ពី @BotFather)</label>
  <input id="i_tok" type="text" placeholder="123456:ABC-DEF..."></div></div>
 <div class="row"><div class="fld"><label>Channel (@name ឬ -100...)</label>
  <input id="i_ch" type="text" placeholder="@mychannel"></div></div>
 <div class="mini"><button id="b_tgsave">រក្សាទុក</button></div>
 <div class="tgnote">លេខសម្ងាត់រក្សាទុកតែក្នុងទូរស័ព្ទអ្នក មិនមានក្នុងឯកសារទេ</div>
</div>

<div class="sec">ផ្សេងៗ</div>
<div class="mini">
 <button id="b_num">លេខ៖ 15</button>
 <button id="b_today">កាលបរិច្ឆេទ និងម៉ោង ឥឡូវ</button>
 <button id="b_auto">កាលបរិច្ឆេទស្វ័យប្រវត្តិ</button>
 <button id="b_copy">ចម្លងអក្សរ</button>
 <button id="b_reset">ដាក់តម្លៃដូចដើម</button>
</div>
</div>

<div id="pop"><div class="box">
 <h4 id="pop_t">កែ</h4>
 <input id="pop_i" type="text">
 <div class="bb"><button id="pop_c">បោះបង់</button><button class="ok" id="pop_k">រួចរាល់</button></div>
 <button class="auto" id="pop_a">ត្រឡប់ទៅស្វ័យប្រវត្តិ</button>
</div></div>

<div id="save"><div class="box">
 <div class="tip">ចុចឱ្យជាប់លើរូប ➜ រើស “Save Image”</div>
 <img id="save_img" alt="">
 <button class="dl" id="save_d">ទាញយក (Download)</button>
 <button id="save_x">បិទ</button>
</div></div>

<script>
(function(){
function boot(m){var b=document.getElementById('boot');if(b){b.style.display='block';
 b.textContent='មានបញ្ហា: '+m;}}
window.onerror=function(m,s,l){boot(m+' @'+l);};
try{

var $=function(i){return document.getElementById(i);};
var cv=$('cv'), ctx=cv.getContext('2d');
if(!ctx){boot('canvas not supported');return;}
var W=1080,H=1080;
var FKR="'Kantumruy Pro','Khmer OS','Noto Sans Khmer',sans-serif";
var FN="'Archivo','Arial Black',Arial,sans-serif";

/* --- measured from the SMART TRADER KH artwork (1280 -> 1080) --- */
/* cards: left centre x 303, right centre x 777                    */
/* red panel row 1: y 452..556   row 2: y 708..812                 */
var SLOT=[
 {cx:303, by:527, k:'chi'},   /* មួយជី      top-left     */
 {cx:777, by:527, k:'dam'},   /* មួយតម្លឹង  top-right    */
 {cx:303, by:782, k:'oz'},    /* មួយអោន     bottom-left  */
 {cx:777, by:782, k:'kg'}     /* មួយគីឡូ    bottom-right */
];
var PANW=440;   /* usable width inside a red panel */
var DATE_Y=280, DATE_CX=540, DATE_MAX=920;  /* gap between banner and cards */
var OUT='#6B0000';                          /* outline, like the old poster */

var THEME=1, bg=null, bgOK=false;
var ADJ={date:{dx:0,dy:0,sc:1},price:{dx:0,dy:0,sc:1}};
var GN={date:'កាលបរិច្ឆេទ',price:'តម្លៃ'};
var SEL=null, REG={}, drag=null, PHIT=[], AUTOLINE='', AUTOP=['','','',''];
var UNAME={chi:'មួយជី',dam:'មួយតម្លឹង',oz:'មួយអោន',kg:'មួយគីឡូ'};
var THEMES={
 1:{price:'#F8E0A0',date:'#FFFFFF'},
 2:{price:'#FFFFFF',date:'#F8E0A0'},
 3:{price:'#FFD429',date:'#FFFFFF'}
};

var SKEY='stkh_v5';
function saveMine(){
 try{
  localStorage.setItem(SKEY,JSON.stringify({
   adj:ADJ, th:THEME, kh:KHNUM,
   cp:$('c_price').value, cd:$('c_date').value}));
 }catch(e){}
}
function loadMine(){
 try{
  var raw=localStorage.getItem(SKEY); if(!raw)return;
  var o=JSON.parse(raw); if(!o)return;
  if(o.adj){var k; for(k in ADJ)if(o.adj[k]&&typeof o.adj[k].dx==='number')ADJ[k]=o.adj[k];}
  if(typeof o.kh==='number')KHNUM=o.kh;
  if(o.cp)$('c_price').value=o.cp;
  if(o.cd)$('c_date').value=o.cd;
  if(typeof o.th==='number'){
   THEME=o.th;
   var tb=document.querySelectorAll('.tb'),i;
   for(i=0;i<tb.length;i++)
    tb[i].className=(parseInt(tb[i].getAttribute('data-t'),10)===THEME)?'tb on':'tb';
  }
 }catch(e){}
}
function mark(g,x0,y0,x1,y1){
 var r=REG[g];
 if(!r)REG[g]={x0:x0,y0:y0,x1:x1,y1:y1};
 else{if(x0<r.x0)r.x0=x0;if(y0<r.y0)r.y0=y0;if(x1>r.x1)r.x1=x1;if(y1>r.y1)r.y1=y1;}
}
function rr(x,y,w,h,r){
 if(r>w/2)r=w/2; if(r>h/2)r=h/2;
 ctx.beginPath(); ctx.moveTo(x+r,y);
 ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
 ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
 ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
 ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
}
function wid(t,f){ctx.font=f;return ctx.measureText(t).width;}
function fitSz(t,mk,max,start,min){
 var z=start; while(z>min && wid(t,mk(z))>max) z-=1; return z;
}
/* placed by arithmetic - never relies on ctx.textAlign */
function txt(t,x,y,f,fill,al){
 if(t===''||t==null)return 0;
 ctx.font=f;
 var w=ctx.measureText(t).width, dx=0;
 if(al==='center')dx=-w/2; else if(al==='right')dx=-w;
 ctx.textAlign='left'; ctx.textBaseline='alphabetic';
 ctx.fillStyle=fill; ctx.fillText(t,x+dx,y);
 return w;
}
function otxt(t,x,y,f,fill,sw,al){
 if(t===''||t==null)return 0;
 ctx.font=f;
 var w=ctx.measureText(t).width, dx=0;
 if(al==='center')dx=-w/2; else if(al==='right')dx=-w;
 ctx.textAlign='left'; ctx.textBaseline='alphabetic';
 if(sw>0){ctx.lineJoin='round'; ctx.miterLimit=2;
  ctx.strokeStyle=OUT; ctx.lineWidth=sw; ctx.strokeText(t,x+dx,y);}
 ctx.fillStyle=fill; ctx.fillText(t,x+dx,y);
 return w;
}
var KD=['០','១','២','៣','៤','៥','៦','៧','៨','៩'];
function kdig(n){var s=String(n),o='',i,c;
 for(i=0;i<s.length;i++){c=s.charAt(i);o+=(c>='0'&&c<='9')?KD[+c]:c;}return o;}
var KM=['មករា','គុម្ភៈ','មីនា','មេសា','ឧសភា','មិថុនា',
        'កក្កដា','សីហា','កញ្ញា','តុលា','វិច្ឆិកា','ធ្នូ'];
var KHNUM=0;   /* 0 = 15 / 6:59   1 = ១៥ / ៦:៥៩ */
function nd(n){return KHNUM?kdig(n):String(n);}
function todayKm(){var d=new Date();
 return 'ថ្ងៃទី '+nd(d.getDate())+' '+KM[d.getMonth()]+' '+nd(d.getFullYear());}
function periodKm(h){
 if(h<5)return 'យប់';
 if(h<12)return 'ព្រឹក';
 if(h<13)return 'ថ្ងៃត្រង់';
 if(h<18)return 'រសៀល';
 if(h<20)return 'ល្ងាច';
 return 'យប់';
}
function nowKm(){var d=new Date(),h=d.getHours(),m=d.getMinutes();
 var t=h%12; if(t===0)t=12;
 return 'គិតត្រឹមម៉ោង '+nd(t)+':'+nd((m<10?'0':'')+m)+' នាទី '+periodKm(h);}
function money(n){
 n=Math.round(n);
 var s=String(Math.abs(n)),o='',c=0,i;
 for(i=s.length-1;i>=0;i--){o=s.charAt(i)+o;c++;if(c%3===0&&i>0)o=','+o;}
 return (n<0?'-':'')+o;
}
/* the shop's own formulas */
function units(oz){var dam=oz/0.83;
 return {chi:dam/10, oz:oz, dam:dam, kg:dam*26.67};}

function draw(){
 try{ real(); }
 catch(e){ ctx.fillStyle='#8a0c18'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ffd0d0'; ctx.font='26px sans-serif'; ctx.textAlign='left';
  ctx.fillText('draw error: '+e.message,40,80); }
}

function real(){
 REG={}; PHIT=[];
 var CP=$('c_price').value;

 if(bgOK&&bg){ ctx.drawImage(bg,0,0,W,H); }
 else { ctx.fillStyle='#8a0c18'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#f0d0a0'; ctx.font='30px '+FKR; ctx.textAlign='center';
  ctx.fillText('កំពុងផ្ទុករូបភាព...',W/2,H/2); ctx.textAlign='left'; }

 var CD=$('c_date').value, AD=ADJ.date;
 var autoLine=($('i_date').value.trim()+' '+$('i_time').value.trim()).replace(/\s+/g,' ');
 var dv=$('i_line').value.trim()||autoLine;
 AUTOLINE=autoLine;
 if(dv){
  var dz=fitSz(dv,function(q){return '700 '+q+'px '+FKR;},DATE_MAX,43,12);
  dz=Math.max(11,Math.round(dz*AD.sc));
  var dx2=DATE_CX+AD.dx, dy2=DATE_Y+AD.dy;
  var dw=otxt(dv,dx2,dy2,'700 '+dz+'px '+FKR,CD,Math.max(4,dz*0.16),'center');
  mark('date',dx2-dw/2-12,dy2-dz,dx2+dw/2+12,dy2+dz*0.34);
 }

 var oz=parseFloat($('i_oz').value)||0;
 var now=units(oz), i;

 for(i=0;i<4;i++){
  var S=SLOT[i];
  var vv='$'+money(now[S.k]);
  AUTOP[i]=String(Math.round(now[S.k]));
  var vz=fitSz(vv,function(q){return '800 '+q+'px '+FN;},PANW,66,20);
  vz=Math.max(14,Math.round(vz*ADJ.price.sc));
  var px2=S.cx+ADJ.price.dx, py2=S.by+ADJ.price.dy;
  var pw=txt(vv,px2,py2,'800 '+vz+'px '+FN,CP,'center');
  mark('price',px2-pw/2-10,py2-vz*0.84,px2+pw/2+10,py2+vz*0.24);
  PHIT.push({k:S.k,seed:AUTOP[i],x0:px2-pw/2-14,y0:py2-vz*0.9,x1:px2+pw/2+14,y1:py2+vz*0.3});
 }

 if(SEL&&REG[SEL]){
  var r=REG[SEL];
  ctx.strokeStyle='#4FC3F7'; ctx.lineWidth=3;
  if(ctx.setLineDash)ctx.setLineDash([14,10]);
  rr(r.x0-6,r.y0-6,(r.x1-r.x0)+12,(r.y1-r.y0)+12,14); ctx.stroke();
  if(ctx.setLineDash)ctx.setLineDash([]);
 }
}

/* ---------- interaction ---------- */
function ptr(e){
 var r=cv.getBoundingClientRect();
 var t=(e.touches&&e.touches[0])?e.touches[0]:e;
 return {x:(t.clientX-r.left)*(W/r.width), y:(t.clientY-r.top)*(H/r.height)};
}
function groupAt(p){
 var ks=['date','price'],i,r;
 for(i=0;i<ks.length;i++){r=REG[ks[i]];
  if(r&&p.x>=r.x0-16&&p.x<=r.x1+16&&p.y>=r.y0-16&&p.y<=r.y1+16)return ks[i];}
 return null;
}
function showCtrl(){
 if(SEL){$('ctrl').style.display='flex'; $('ctrl_n').textContent=GN[SEL];}
 else $('ctrl').style.display='none';
}
function down(e){
 var p=ptr(e), g=groupAt(p);
 if(!g){SEL=null;showCtrl();draw();return;}
 drag={g:g,sx:p.x,sy:p.y,ox:ADJ[g].dx,oy:ADJ[g].dy,mv:0};
 SEL=g; showCtrl(); draw();
 if(e.preventDefault)e.preventDefault();
}
function move(e){
 if(!drag)return;
 var p=ptr(e), A=ADJ[drag.g];
 A.dx=drag.ox+(p.x-drag.sx); A.dy=drag.oy+(p.y-drag.sy);
 drag.mv=Math.max(drag.mv,Math.abs(p.x-drag.sx)+Math.abs(p.y-drag.sy));
 draw();
 if(e.preventDefault)e.preventDefault();
}
var cur=null;
/* turn any one unit back into the ounce price */
function toOunce(k,v){
 if(k==='chi')return v*10*0.83;
 if(k==='dam')return v*0.83;
 if(k==='kg') return (v/26.67)*0.83;
 return v;
}
function openEdit(id,lab,seed,unit){
 cur={id:id,unit:unit||''};
 $('pop_t').textContent=lab;
 $('pop_i').value=(unit?seed:($(id).value.trim()||seed||''));
 $('pop_i').setAttribute('inputmode',unit?'decimal':'text');
 $('pop_a').style.display=unit?'none':'block';
 $('pop').style.display='block';
 setTimeout(function(){$('pop_i').focus();},60);
}
function up(){
 if(!drag)return;
 var g=drag.g, mv=drag.mv, sx=drag.sx, sy=drag.sy; drag=null; saveMine();
 if(mv>=10)return;
 if(g==='date'){openEdit('i_line','កាលបរិច្ឆេទ និងម៉ោង',AUTOLINE);return;}
 if(g==='price'){
  var i; for(i=0;i<PHIT.length;i++){
   var h=PHIT[i];
   if(sx>=h.x0&&sx<=h.x1&&sy>=h.y0&&sy<=h.y1){
    openEdit('i_oz',UNAME[h.k],h.seed,h.k); return;}
  }
 }
}
cv.addEventListener('touchstart',down,false);
cv.addEventListener('touchmove',move,false);
cv.addEventListener('touchend',up,false);
cv.addEventListener('mousedown',down,false);
cv.addEventListener('mousemove',move,false);
cv.addEventListener('mouseup',up,false);

$('pop_i').addEventListener('input',function(){
 if(!cur)return;

/* ---------- send to Telegram ---------- */
function tgGet(k){try{return (localStorage.getItem(k)||'').trim();}catch(e){return '';}}
function tgSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function capText(){
 var u=units(parseFloat($('i_oz').value)||0);
 return 'តម្លៃហាងឆេងមាសអន្តរជាតិ\n'
  +($('i_line').value.trim()||($('i_date').value+' '+$('i_time').value))+'\n'
  +'មួយជី = $'+money(u.chi)+'\nមួយតម្លឹង = $'+money(u.dam)+'\n'
  +'មួយអោន = $'+money(u.oz)+'\nមួយគីឡូ = $'+money(u.kg);
}
function dataURLtoBlob(d){
 var p2=String(d).split(','), mm=/:(.*?);/.exec(p2[0]);
 var m=mm?mm[1]:'image/jpeg', b=atob(p2[1]||'');
 var n=b.length, u8=new Uint8Array(n);
 while(n--)u8[n]=b.charCodeAt(n);
 return new Blob([u8],{type:m});
}
function getBlob(cb){
 if(cv.toBlob){ try{ cv.toBlob(function(b){cb(b);},'image/jpeg',0.92); return; }catch(e){} }
 try{ cb(dataURLtoBlob(cv.toDataURL('image/jpeg',0.92))); }catch(e){ cb(null); }
}
function tgStatus(t){$('tg_st').textContent=t;}
function tgSend(){
 var tok=tgGet('tg_tok'), ch=tgGet('tg_ch');
 if(!tok||!ch){tgStatus('សូមបំពេញ Bot token និង Channel ខាងក្រោម');return;}
 var keep=SEL; SEL=null; draw();
 tgStatus('កំពុងផ្ញើ...');
 getBlob(function(blob){
  SEL=keep; draw();
  if(!blob){ tgStatus('រូបភាពមានបញ្ហា'); return; }
  var fd=new FormData();
  fd.append('chat_id',ch);
  fd.append('caption',capText());
  fd.append('photo',blob,'gold.jpg');
  fetch('https://api.telegram.org/bot'+tok+'/sendPhoto',{method:'POST',body:fd})
   .then(function(r){return r.json();})
   .then(function(j){
     if(j&&j.ok)tgStatus('ផ្ញើរួចរាល់ ✓');
     else tgStatus('មិនបាន: '+((j&&j.description)||'unknown'));
   })
   .catch(function(e){ tgStatus('មិនបាន: '+e.message+' (ពិនិត្យអ៊ីនធឺណិត)'); });
 });
}
$('b_tg').onclick=tgSend;

};
